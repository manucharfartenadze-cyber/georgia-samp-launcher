name: Build Georgia SA-MP Launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        run: |
          unzip -q Georgia-SA-MP-Launcher-Android-v4.zip -d extracted

      - name: Build APK
        working-directory: extracted/Georgia-SA-MP-Launcher/android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Georgia-SA-MP-Launcher-APK
          path: extracted/Georgia-SA-MP-Launcher/android/app/build/outputs/apk/debug/app-debug.apk
